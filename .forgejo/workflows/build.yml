name: Build and Package

on:
  push:
    branches: [ '**' ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Docker CLI
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker CLI..."
            if ! curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz | tar xzvf - --strip-components=1 -C /usr/local/bin docker/docker 2>/dev/null; then
              apt-get update -qq && apt-get install -y -qq docker.io >/dev/null 2>&1 || true
            fi
          fi
          docker --version || true

      - name: Docker Cleanup
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "Stopping and removing all Docker containers..."
            docker stop $(docker ps -aq) || true
            docker rm $(docker ps -aq) || true
          else
            echo "Docker not found, skipping cleanup."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0 # Wichtig für den Vergleich mit dem main-branch

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Clean up old PostgreSQL instances
        run: |
          echo "Checking for stale PostgreSQL containers on this runner..."
          OLD_CONTAINERS=$(docker ps -q --filter "ancestor=pgvector/pgvector:pg17" 2>/dev/null || true)
          if [ -n "$OLD_CONTAINERS" ]; then
            echo "Stopping stale pgvector containers: $OLD_CONTAINERS"
            docker stop $OLD_CONTAINERS || true
            docker rm $OLD_CONTAINERS || true
          fi
          docker stop postgres-ci-feed2mastodon 2>/dev/null || true
          docker rm postgres-ci-feed2mastodon 2>/dev/null || true

      - name: Start PostgreSQL (pgvector)
        run: |
          echo "Starting PostgreSQL container with pgvector..."
          docker run -d \
            --name postgres-ci-feed2mastodon \
            --network host \
            -e POSTGRES_DB=quarkus_test \
            -e POSTGRES_USER=quarkus_test \
            -e POSTGRES_PASSWORD=quarkus_test \
            pgvector/pgvector:pg17

          echo "Waiting for PostgreSQL to become ready..."
          TIMEOUT=60
          until docker exec postgres-ci-feed2mastodon pg_isready -U quarkus_test -d quarkus_test >/dev/null 2>&1 || [ $TIMEOUT -le 0 ]; do
            echo "PostgreSQL starting... ($TIMEOUT s remaining)"
            sleep 2
            TIMEOUT=$((TIMEOUT - 2))
          done

          if [ $TIMEOUT -le 0 ]; then
            echo "PostgreSQL failed to become healthy. Logs:"
            docker logs postgres-ci-feed2mastodon
            exit 1
          fi
          echo "PostgreSQL is ready and accepting connections."

#      - name: Set up Node.js
#        uses: actions/setup-node@v4
#        with:
#          node-version: 'latest'

#      - name: Dump Actor
#        run: echo "Der Actor ist ${{ github.actor }}"

      # NEU: Versionsprüfung und Erhöhung für Forgejo
      - name: Check and Bump Version
        # Nur bei PRs, nicht bei Push auf Main, und nicht durch Bots
        if: github.event_name == 'pull_request' && !contains(github.actor, '[bot]')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x mvnw

          # Version im Ziel-Branch (meist main) und Quell-Branch (PR) vom Remote holen
          git fetch origin ${{ github.base_ref }}
          git fetch origin ${{ github.head_ref }}

          MAIN_VERSION=$(git show origin/${{ github.base_ref }}:pom.xml | grep -oPm1 "(?<=<version>)[^<]+" | head -n 1)
          REMOTE_PR_VERSION=$(git show origin/${{ github.head_ref }}:pom.xml | grep -oPm1 "(?<=<version>)[^<]+" | head -n 1)

          echo "Main Version: $MAIN_VERSION"
          echo "Remote PR Version: $REMOTE_PR_VERSION"

          if [ "$REMOTE_PR_VERSION" != "$MAIN_VERSION" ]; then
            echo "Version auf Remote-Branch wurde bereits erhöht ($REMOTE_PR_VERSION)."
            # Lokalen Stand auf den aktuellen Remote-Branch bringen
            git checkout -B ${{ github.head_ref }} origin/${{ github.head_ref }}
          else
            echo "Versionen sind identisch ($REMOTE_PR_VERSION). Erhöhe Patch-Level..."

            git checkout -B ${{ github.head_ref }} origin/${{ github.head_ref }}

            IFS='.' read -r major minor patch <<< "$REMOTE_PR_VERSION"
            NEW_VERSION="$major.$minor.$((patch + 1))"

            ./mvnw versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false

            git config --global user.name "forgejo-actions[bot]"
            git config --global user.email "forgejo-actions[bot]@forgejo.codeheap.dev"

            git add pom.xml
            git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"

            # Push zurück in den Head-Branch des Pull Requests
            if ! git push origin ${{ github.head_ref }}; then
              echo "Warnung: Push fehlgeschlagen (mögliche Race Condition). Prüfe Remote-Stand..."
              git fetch origin ${{ github.head_ref }}
              LATEST_REMOTE_VERSION=$(git show origin/${{ github.head_ref }}:pom.xml | grep -oPm1 "(?<=<version>)[^<]+" | head -n 1)
              if [ "$LATEST_REMOTE_VERSION" != "$MAIN_VERSION" ]; then
                echo "Remote-Branch hat bereits die erhöhte Version ($LATEST_REMOTE_VERSION). Fahre mit Build fort."
                git checkout -B ${{ github.head_ref }} origin/${{ github.head_ref }}
              else
                echo "Push fehlgeschlagen und Version auf Remote ist noch nicht erhöht. Breche ab."
                exit 1
              fi
            fi
          fi

      - name: Build with Maven Wrapper
        env:
          QUARKUS_DATASOURCE_USERNAME: quarkus_test
          QUARKUS_DATASOURCE_PASSWORD: quarkus_test
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/quarkus_test
          GEMINIE_ACCESS_TOKEN: ${{ secrets.GEMINIE_ACCESS_TOKEN }}
          MASTODON_PRIVATE_ACCESS_TOKEN: ${{ secrets.MASTODON_PRIVATE_ACCESS_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HOMEASSISTANT_API_TOKEN: ${{ secrets.HOMEASSISTANT_API_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B -U clean package -Dquarkus.profile=prod -Daether.connector.http.retryHandler.count=5 -Dmaven.wagon.http.retryHandler.count=5 --file pom.xml

      - name: Docker Cleanup (Post-Build)
        if: always()
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "Stopping and removing all Docker containers..."
            docker stop $(docker ps -aq) || true
            docker rm $(docker ps -aq) || true
          else
            echo "Docker not found, skipping cleanup."
          fi